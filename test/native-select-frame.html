<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native select iframe fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="native-select-frame" class="iframe-fixture">
    <label id="education-start-month-label" for="education-start-month">Start Date (Month)</label>
    <select id="education-start-month"
      class="iCIMS_Forms_Global customFieldContainer iCIMS_Forms_DropDown form-control"
      aria-labelledby="education-start-month-label"
      aria-required="true"
      role="combobox"
      aria-expanded="false"
      aria-controls="education-start-month-listbox"
      aria-activedescendant=""
      icimsdropdown-enabled="0"
      icimsdropdown-ajax="1"
      icimsdropdown-search="0">
      <option value="0"></option>
      <option value="01">Jan</option>
      <option value="02" selected>Feb</option>
      <option value="03">Mar</option>
    </select>
  </main>
</body>
</html>
