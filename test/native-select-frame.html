<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native select iframe fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="native-select-frame" class="iframe-fixture">
    <label id="education-start-month-label" for="education-start-month">Start Date (Month)</label>
    <select id="education-start-month" aria-labelledby="education-start-month-label">
      <option value="0"></option>
      <option value="01">Jan</option>
      <option value="02" selected>Feb</option>
      <option value="03">Mar</option>
    </select>
  </main>
</body>
</html>
