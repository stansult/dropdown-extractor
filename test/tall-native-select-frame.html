<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tall native select iframe fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="tall-native-select-frame" class="iframe-fixture">
    <p>Scrollable same-origin iframe fixture</p>
    <div class="tall-iframe-spacer" aria-hidden="true"></div>
    <label id="education-start-day-label" for="education-start-day">Start Date (Day)</label>
    <select id="education-start-day" aria-labelledby="education-start-day-label">
      <option value="0"></option>
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
    </select>
  </main>
</body>
</html>
